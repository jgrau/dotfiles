# Herdr configuration — deployed to ~/.config/herdr/config.toml via home-manager
# (see nix/home.nix). Reload a running server after edits with:
#   herdr server reload-config   (or prefix+shift+r inside herdr)
#
# Config reference: https://herdr.dev/docs/config-reference/
# Keyboard guide:   https://herdr.dev/docs/keyboard/

# Skip the first-run onboarding flow (we configure declaratively instead).
onboarding = false

# ─── Theme ──────────────────────────────────────────────────────────────────
# Match the catppuccin mocha look used by tmux (catppuccin plugin) and Neovim.
[theme]
name = "catppuccin"

# ─── Keybindings ─────────────────────────────────────────────────────────────
[keys]
# Match the tmux prefix (Ctrl-f) so prefix+<key> muscle memory carries over.
# NOTE: with this prefix, copy-mode's ctrl+f is page-forward; use vi j/k/ctrl+d
# for scrolling instead (see https://herdr.dev/docs/keyboard/).
prefix = "ctrl+f"

# Detach from the current session on prefix+d and rename tabs with prefix+,
# to match tmux muscle memory.
detach     = "prefix+d"
rename_tab = "prefix+,"

# Seamless Vim/Neovim <-> herdr pane navigation on ctrl+h/j/k/l is handled by
# the vim-herdr-navigation plugin via [[keys.command]] below — NOT by the
# built-in focus_pane_* actions, which would unconditionally steal those keys
# from Neovim. The built-ins stay on the prefix so keyboard-only pane focus
# still works: prefix+h/j/k/l.
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# Splits: keep herdr's prefix+v (side-by-side) and add prefix+| to match the
# tmux `|` bind. prefix+minus (stacked) already matches the tmux `-` bind.
split_vertical   = ["prefix+v", "prefix+|"]
split_horizontal = "prefix+minus"

# Jump back to the previously focused pane (mirrors tmux `C-a last-pane`).
last_pane = "prefix+semicolon"

# Open an existing Git worktree checkout (built-in action, unbound by default).
# Pairs with herdr's built-in new_worktree on prefix+shift+g. prefix+g is
# otherwise free.
open_worktree = "prefix+g"

# tmux-style one-key pane resizing without entering resize mode. resize_mode
# (prefix+r) still works for repeated adjustments.
resize_pane_left  = "ctrl+shift+alt+left"
resize_pane_down  = "ctrl+shift+alt+down"
resize_pane_up    = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

# tmux built-in swap-pane keys: prefix+{ swaps with the previous pane,
# prefix+} with the next. herdr models swaps directionally (left/right), so
# map { -> left and } -> right via the `herdr pane swap` CLI. This is on top
# of herdr's built-in directional swap on prefix+shift+h/j/k/l.
[[keys.command]]
key = "prefix+{"
type = "shell"
command = "herdr pane swap --current --direction left"
description = "swap pane previous/left (tmux prefix+{)"

[[keys.command]]
key = "prefix+}"
type = "shell"
command = "herdr pane swap --current --direction right"
description = "swap pane next/right (tmux prefix+})"

# ─── Vim/Neovim-aware navigation (vim-herdr-navigation plugin) ───────────────
# On each press the plugin checks the focused pane's foreground process:
#   - Vim/Neovim running -> forwards the chord into the pane (moves its split;
#     at a split edge Neovim calls back into herdr to cross the pane boundary).
#   - anything else       -> moves herdr's pane focus in that direction.
# Requires: `herdr plugin install paulbkim-dev/vim-herdr-navigation` and the
# matching Neovim editor mapping in config/nvim/lua/config/plugins.lua.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# prefix+shift+v (prefix+v is taken by split_vertical; prefix+shift+r is
# herdr's built-in reload-config).
[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle review pane"

# ─── herdr-nvim (ChmaraX/herdr-nvim) ─────────────────────────────────────────
# Full-height nvim sidebar + agent-output file picker. The nvim half
# (annotations) is set up in config/nvim/lua/config/plugins.lua.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# ─── Sesh for Herdr (fullerzz/herdr-plugin-sesh) ────────────────────────────
# Sesh-style workspace/session picker on the plugin's documented binding;
# rename_tab moved to tmux's prefix+, above.
[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = '"$HOME/.config/herdr/sesh-open.sh"'
description = "open Sesh workspace picker"

[[keys.command]]
key = "prefix+s"
type = "shell"
command = '"$HOME/.config/herdr/sesh-open.sh"'
description = "open Sesh workspace picker (short binding)"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "switch to previous Sesh workspace"

# ─── Command palette (JanTvrdik/herdr-command-palette) ────────────────────
# fzf popup of every action from every installed plugin. Requires fzf + jq.
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "jt.command-palette.open"
description = "command palette"

# ─── Plugin manager (speardragon/herdr-plugin-manager) ────────────────────
# Popup TUI over `herdr plugin` — install/update/remove/toggle + marketplace.
# The plugin recommends prefix+p, but that's taken by the command palette, so
# use prefix+shift+p. This overrides herdr's built-in rename_pane; rename a
# pane via the settings/command palette if needed.
[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

# ─── Workspace PR status refresh (local workspace-pr plugin) ──────────────
# Re-poll gh for every workspace's PR status on demand. workspace.focused only
# refreshes the workspace you switch to, so this covers updating CI/review while
# idle. prefix+shift+r is herdr's reload-config; use prefix+shift+g… taken by
# new_worktree. prefix+r is resize_mode; prefix+shift+i is free.
[[keys.command]]
key = "prefix+shift+i"
type = "plugin_action"
command = "workspace-pr.refresh-all"
description = "refresh workspace PR status (all)"

# ─── GitHub PR status (wyattjoh/herdr-plugin-gh-pr) ───────────────────────
# The plugin writes each agent pane's branch PR status to a `pr` metadata
# token; the sidebar only renders tokens listed in a row, so add $pr to the
# agent row. Rows below mirror herdr's default agent layout plus $pr. Needs
# bun + gh (authenticated) on PATH.
[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab", "$pr"], ["agent"]]

# ─── Workspace PR status line (local workspace-pr plugin) ─────────────────
# The local `workspace-pr` plugin writes each workspace's branch PR status to a
# workspace-scoped `pr` metadata token (state + review + CI, in words), so the
# sidebar can show a PR line *under the workspace* — unlike wyattjoh/gh-pr,
# which is pane/agent-scoped. Rows below mirror herdr's default space layout
# plus a third `$pr` line; the line collapses when a workspace has no PR.
# Plugin lives at config/herdr/plugins/workspace-pr and is linked with
#   herdr plugin link <that path>
# Needs bun + gh (authenticated) on PATH. Refresh: on workspace.focused, on
# server startup (--all), and via the workspace-pr.refresh-all action below.
[ui.sidebar.spaces]
# Blank row between workspace entries so the list is easier to scan (default 0
# packs them together).
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$pr"]]
