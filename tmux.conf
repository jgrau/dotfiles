# Use Vim-style keys in copy mode and the command prompt.
setw -g mode-keys vi

# Change the tmux prefix from Ctrl-b to Ctrl-f.
unbind C-b
set -g prefix C-f

# Start window numbering at 1 instead of 0.
set -g base-index 1

# Renumber windows after one is closed so numbering stays contiguous.
set -g renumber-windows on

###########################
# Status Bar
###########################

# Use the terminal's default background color for the status bar.
set -g status-bg default

# Set the status bar foreground text color.
set -g status-fg colour239

# Left-align status bar content.
set -g status-justify left

###########################
# Pane Focus
###########################

# Catppuccin owns pane border colors, so configure its options instead of
# setting pane-active-border-style directly.
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_sky},bold"

# tmux only colors split borders, not a full box around edge panes. Add a small
# active-pane marker so focus is visible even when the active pane is at an edge.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=colour16,bg=colour81,bold] ACTIVE #[default],}"

###########################
# Pane Layout
###########################

# Keep the current layout shape, but equalize pane sizes after every split and pane close.
set-hook -g after-split-window 'select-layout -E'
set-hook -g after-kill-pane 'run-shell -b -d 0.1 "tmux select-layout -E"'
set-hook -g pane-exited 'run-shell -b -d 0.2 "tmux select-layout -E"'

###########################
# Input + Key Handling
###########################

# Remove the key sequence delay so Escape-based bindings feel instant,
# which also avoids Neovim escape timing issues.
set -s escape-time 0

# Bind Ctrl-a to jump back to the previously active pane.
bind-key C-a last-pane

# Open Television's tmux window picker in a popup.
bind-key o display-popup -E -w 80% -h 80% -b 'rounded' -S 'fg=#755375' \
  "tv tmux-windows --no-status-bar --no-remote --preview-size 70"

# Enable mouse support for selecting panes, resizing, scrolling, and switching windows.
set -g mouse on

# Enable xterm-style modified key reporting for older terminal/app combinations.
set -g xterm-keys on

# Enable tmux extended key reporting so apps can distinguish more modified keys.
set -g extended-keys on

# Use CSI-u encoding for extended keys; Pi warns when this stays on tmux's xterm default.
set -g extended-keys-format csi-u

# # Ignore terminal title escape sequences from apps like Pax/Pi so pane titles stay stable.
# set -g allow-set-title off

###########################
# Plugins
###########################

# List of plugins managed by TPM.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# URL picker plugin: press prefix+u to search URLs from the current pane and scrollback.
set -g @plugin 'wfxr/tmux-fzf-url'

# Bind the URL picker plugin to the "u" key after the tmux prefix.
set -g @fzf-url-bind 'u'

# Limit URL picker history scanning to the most recent 2000 lines.
set -g @fzf-url-history-limit '2000'

###########################
# Environment + Startup
###########################

# Set PATH for programs launched by tmux so Homebrew-installed tools are found first.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# Start the TPM plugin manager.
run "/opt/homebrew/opt/tpm/share/tpm/tpm"

# Show tmux window names in the status bar instead of pane titles.
# Keep this after TPM so theme/plugin defaults do not switch it back to #T.
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}] #I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W "
set -g window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}] #I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #W "
