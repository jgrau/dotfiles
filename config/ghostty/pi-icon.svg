<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="pi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1E0A3C" flood-opacity="0.45"/>
    </filter>
    <radialGradient id="gloss" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="112" y="112" width="800" height="800" rx="180" ry="180" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="180" ry="180" fill="url(#gloss)"/>

  <!-- pi glyph -->
  <g filter="url(#shadow)" fill="url(#pi)">
    <!-- top bar -->
    <rect x="284" y="356" width="456" height="96" rx="36"/>
    <!-- left leg (vertical) -->
    <rect x="372" y="430" width="96" height="258" rx="30"/>
    <!-- right leg, with a subtle outward flick at the foot -->
    <path d="M 560 460 q 0 -30 30 -30 h 36 q 30 0 30 30 v 168
             q 0 34 26 46 q 26 12 52 0 l 22 56
             q -52 26 -104 6 q -50 -20 -76 -64
             q -16 -28 -16 -70 z"/>
  </g>
</svg>
