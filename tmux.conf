# NOTE: This file is loaded as `programs.tmux.extraConfig` from nix/home.nix.
# Core options (prefix, mouse, vi keys, base-index, escape-time, focus-events,
# terminal) and all plugins are configured declaratively in home.nix via the
# home-manager tmux module — do NOT redefine them here. This file holds only the
# extra settings and key bindings the module does not cover. extraConfig is
# sourced AFTER plugins load, so catppuccin's @thm_* variables are available.

# Renumber windows after one is closed so numbering stays contiguous.
set -g renumber-windows on

###########################
# Status Bar
###########################

# Use the terminal's default background color for the status bar.
set -g status-bg default

# Set the status bar foreground text color.
set -g status-fg colour239

# Left-align status bar content.
set -g status-justify left

###########################
# Pane Focus
###########################

# tmux only colors split borders, not a full box around edge panes. Make the
# split lines heavier, add directional indicators, and show an active-pane marker
# so focus stays visible even when the active pane is at a window edge.
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g pane-border-status top
set -g pane-border-format "#{?pane_marked,#[fg=colour16,bg=colour220,bold] SEND HERE #[default],}#{?pane_active,#[fg=colour16,bg=colour81,bold] ACTIVE #[default],}#{?pane_title,#[fg=colour250] #{pane_title} #[default],}"

###########################
# Pane Layout
###########################

# Keep the current layout shape, but equalize pane sizes after every split and pane close.
set-hook -g after-split-window 'if -F "#{==:#{@skip_auto_equalize},1}" "" "select-layout -E"'
set-hook -g after-kill-pane 'run-shell -b -d 0.1 "tmux select-layout -E"'
set-hook -g pane-exited 'run-shell -b -d 0.2 "tmux select-layout -E"'

# Rebalance an existing three-pane window into a 25% / 50% / 25% vertical split.
bind-key V run-shell 'if [ "$(tmux -S "#{socket_path}" display-message -p "#{window_panes}")" = 3 ]; then tmux -S "#{socket_path}" select-layout even-horizontal; tmux -S "#{socket_path}" resize-pane -t "#{window_id}.0" -x 25%; tmux -S "#{socket_path}" resize-pane -t "#{window_id}.1" -x 50%; else tmux -S "#{socket_path}" display-message "Need exactly 3 panes to use 25/50/25 layout"; fi'

###########################
# Key Bindings
###########################

# Bind Ctrl-a to jump back to the previously active pane.
bind-key C-a last-pane

# Split panes with | (horizontal/side-by-side) and - (vertical/stacked),
# opening the new pane in the current pane's working directory.
# (tmux-pain-control also provides these; defined here to keep them explicit.)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Open Television's tmux window picker in a popup.
bind-key o display-popup -E -w 80% -h 80% -b 'rounded' -S 'fg=#755375' \
  "tv tmux-windows --no-status-bar --no-remote --preview-size 70"

# Start a `pi` session in a popup window.
# Use the absolute path: the global PATH set below does not include
# ~/.nix-profile/bin inside popups, so a bare `pi` would fail and the popup
# would close instantly.
bind-key p display-popup -E -d "$HOME" -w 90% -h 90% -b 'rounded' -S 'fg=#755375' \
  "$HOME/.nix-profile/bin/pi"

###########################
# Input + Terminal
###########################

# Enable xterm-style modified key reporting for older terminal/app combinations.
set -g xterm-keys on

# Enable tmux extended key reporting so apps can distinguish more modified keys.
set -g extended-keys on

# Use CSI-u encoding for extended keys; Pi warns when this stays on tmux's xterm default.
set -g extended-keys-format csi-u

# # Ignore terminal title escape sequences from apps like Pax/Pi so pane titles stay stable.
# set -g allow-set-title off

###########################
# Environment
###########################

# Set PATH for programs launched by tmux so Homebrew-installed tools are found
# first, while still including the nix profile dirs where tmux itself and other
# declaratively-installed tools live. Omitting these caused hook commands like
# `run-shell "tmux select-layout -E"` to fail with exit code 127 (command not
# found).
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/etc/profiles/per-user/jgrau/bin:/run/current-system/sw/bin:/Users/jgrau/.nix-profile/bin:/bin:/usr/bin"

# Show tmux window names in the status bar instead of pane titles.
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}] #I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W "
set -g window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}] #I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #W "
