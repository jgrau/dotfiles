prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

notificationsSections:
  - title: All
    filters: ""
  - title: Created
    filters: reason:author
  - title: Participating
    filters: reason:participating
  - title: Mentioned
    filters: reason:mention
  - title: Review Requested
    filters: reason:review-requested
  - title: Assigned
    filters: reason:assign
  - title: Subscribed
    filters: reason:subscribed
  - title: Team Mentioned
    filters: reason:team-mention

defaults:
  view: prs
  refetchIntervalMinutes: 5
  prsLimit: 20
  issuesLimit: 20
  notificationsLimit: 20
  prApproveComment: LGTM
  preview:
    open: true
    width: 0.45
    height: 0.60
    position: auto
  layout:
    prs:
      updatedAt:
        width: 7
      state:
        width: 3
        align: center
      repo:
        width: 12
      title:
        grow: true
      author:
        width: 12
      authorIcon:
        hidden: true
      numComments:
        width: 3
        align: right
      reviewStatus:
        width: 3
        align: center
      ci:
        width: 3
        align: center
      lines:
        width: 12
        align: right
      labels:
        width: 22
        hidden: true
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true

# Catppuccin Mocha palette. gh-dash requires every color when any custom
# theme color is specified.
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparators: true
      compact: false
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#bac2de"
      inverted: "#1e1e2e"
      faint: "#7f849c"
      warning: "#f38ba8"
      success: "#a6e3a1"
      actor: "#b4befe"
    background:
      selected: "#313244"
    border:
      primary: "#89b4fa"
      secondary: "#585b70"
      faint: "#313244"
    inline:
      icons:
        newcontributor: "#f9e2af"
        contributor: "#89b4fa"
        collaborator: "#cba6f7"
        member: "#94e2d5"
        owner: "#f38ba8"
        unknownrole: "#7f849c"

repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60

keybindings:
  prs:
    - key: X
      name: Review with Pax
      command: >-
        "$HOME/.config/gh-dash/review-pr-with-pax.sh"
        "{{.RepoName}}"
        "{{.RepoPath}}"
        "{{.PrNumber}}"
repoPaths:
  landfolk/landfolk: /Users/jgrau/src/landfolk
  landfolk/pax: /Users/jgrau/src/pax
pager:
  diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: false
