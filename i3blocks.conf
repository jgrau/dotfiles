[kubernetes]
command=~/.config/i3/scripts/kubernetes
interval=10

[memory]
label=
separator=false
interval=1
command=/usr/lib/i3blocks/memory
color=#dfe3ee

[memory]
label=
instance=/usr/swap
separator=true
interval=10
color=#7ea1a5

[disk]
label=
#instance=/mnt/data
interval=30
separator=false
color=#d9534f

[disk]
label=
instance=/mnt
interval=30
separator=true
color=#ffff00

[cpu_usage]
label=
command=/usr/lib/i3blocks/cpu_usage
interval=1
#min_width=CPU:100.00%
separator=true
color=#00ff7f

[temperature]
#label=TEMP
label=
interval=10
command=/usr/lib/i3blocks/temperature
#color=#8caba8
color=#dcedc1
separator=true

[iface]
label=
instance=wlp4s0
color=#00FFFF
interval=10
separator=true
color=#adff00

[bandwidth]
label=
instance=wlp4s0
interval=1
color=#83d0c9

[time]
command= date '+%d/%m/%Y %H:%M'
label=
interval=1
