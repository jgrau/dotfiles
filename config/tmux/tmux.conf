
set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1





set -g status-keys vi
set -g mode-keys   vi



# rebind main key: C-f
unbind C-b
set -g prefix C-f

# Do not detach when the last shell of a session is exited, instead switch to
# another session
set-option -g detach-on-destroy off

set  -g mouse             on
set  -g focus-events      on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0

# ============================================= #
# Load Nix-packaged plugins                #
# --------------------------------------------- #

# tmuxplugin-sensible
# ---------------------

run-shell $HOME/.local/share/dotfiles-runtime/tmuxplugin-sensible/share/tmux-plugins/sensible/sensible.tmux


# tmuxplugin-yank
# ---------------------

run-shell $HOME/.local/share/dotfiles-runtime/tmuxplugin-yank/share/tmux-plugins/yank/yank.tmux


# tmuxplugin-pain-control
# ---------------------

run-shell $HOME/.local/share/dotfiles-runtime/tmuxplugin-pain-control/share/tmux-plugins/pain-control/pain_control.tmux


# tmuxplugin-vim-tmux-navigator
# ---------------------

run-shell $HOME/.local/share/dotfiles-runtime/tmuxplugin-vim-tmux-navigator/share/tmux-plugins/vim-tmux-navigator/vim-tmux-navigator.tmux


# tmuxplugin-catppuccin
# ---------------------
# Omer-inspired styling, using the current Nix-packaged Catppuccin API.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
# Workmux supplies the icon; Catppuccin keeps it inside the rounded tab.
set -g @catppuccin_window_text " #{?@workmux_status,#{@workmux_status} ,}#W"
set -g @catppuccin_window_current_text " #{?@workmux_status,#{@workmux_status} ,}#W#{?window_zoomed_flag, (󰁌),}"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text " #{b:pane_current_path}"
# Highlight the active pane with a thin lavender divider.
set -g @catppuccin_pane_active_border_style "fg=#{@thm_lavender},bg=default"
set -g @catppuccin_pane_border_style "fg=#{@thm_bg},bg=default"
# Recompute separators on reload instead of retaining the old basic style.
set -guq @catppuccin_window_current_left_separator
set -guq @catppuccin_window_current_middle_separator
set -guq @catppuccin_window_current_right_separator

run-shell $HOME/.local/share/dotfiles-runtime/tmuxplugin-catppuccin/share/tmux-plugins/catppuccin/catppuccin.tmux

# Window tabs across the top, session on the left, current directory on the right.
set -g status on
set -g status-position top
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -g window-status-separator " "


# tmuxplugin-fzf-tmux-url
# ---------------------
set -g @fzf-url-bind "u"
set -g @fzf-url-history-limit "2000"

run-shell $HOME/.local/share/dotfiles-runtime/tmuxplugin-fzf-tmux-url/share/tmux-plugins/fzf-tmux-url/fzf-url.tmux

# ============================================= #

# Plugins load before the custom settings below.

# Use the same Mocha colors in active and inactive panes.
set -g window-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'

# Keep the top border, but omit header text and directional markers.
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-format ''

# Renumber windows after one is closed so numbering stays contiguous.
set -g renumber-windows on

###########################
# Pane Layout
###########################

# Keep the current layout shape, but equalize pane sizes after every split and pane close.
set-hook -g after-split-window 'if -F "#{==:#{@skip_auto_equalize},1}" "" "select-layout -E"'
set-hook -g after-kill-pane 'run-shell -b -d 0.1 "tmux select-layout -E"'
set-hook -g pane-exited 'run-shell -b -d 0.2 "tmux select-layout -E"'

###########################
# Key Bindings
###########################

# Workmux: dashboard, sidebar, and agent navigation (prefix: Ctrl-f).
bind C-s display-popup -w 90% -h 85% -d "#{pane_current_path}" -E "workmux dashboard"
bind C-t run-shell "workmux sidebar"
bind B run-shell "workmux sidebar --session"
bind Tab run-shell "workmux last-agent"
bind a run-shell "workmux last-done"

# Describe a new task; Workmux uses Pax to name its branch from main.
bind-key C-a run-shell "tmux display-popup -t '#{pane_id}' -w 45% -h 20% -d #{q:pane_current_path} -e 'WORKMUX_TASK_PANE=#{pane_id}' -E 'zsh ~/.config/tmux/new-workmux-task.zsh'"

# Review this branch against its base, including uncommitted edits.
bind-key r split-window -h -c "#{pane_current_path}" 'bash "$HOME/.config/review/branch.sh"'

# Split panes with | (horizontal/side-by-side) and - (vertical/stacked),
# opening the new pane in the current pane's working directory.
# (tmux-pain-control also provides these; defined here to keep them explicit.)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

###########################
# Input + Terminal
###########################

# Enable xterm-style modified key reporting for older terminal/app combinations.
set -g xterm-keys on

# Enable tmux extended key reporting so apps can distinguish more modified keys.
set -g extended-keys on

# Use CSI-u encoding for extended keys; Pi warns when this stays on tmux's xterm default.
set -g extended-keys-format csi-u

# # Ignore terminal title escape sequences from apps like Pax/Pi so pane titles stay stable.
# set -g allow-set-title off

###########################
# Environment
###########################

# Set PATH for programs launched by tmux so Homebrew-installed tools are found
# first, while still including the nix profile dirs where tmux itself and other
# declaratively-installed tools live. Omitting these caused hook commands like
# `run-shell "tmux select-layout -E"` to fail with exit code 127 (command not
# found).
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/etc/profiles/per-user/jgrau/bin:/run/current-system/sw/bin:/Users/jgrau/.nix-profile/bin:/bin:/usr/bin"
